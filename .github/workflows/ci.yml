name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/salon_test

      - run: npm run test:concurrency
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/salon_test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Ephemeral containers on the existing Actions runner. No cloud keys or paid services.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start isolated Supabase (no hosted project)
        run: |
          mkdir -p .e2e
          npx --yes supabase@2.121.0 start > .e2e/start.log 2>&1
          npx --yes supabase@2.121.0 status -o json > .e2e/status.json
      - run: node scripts/prepare-e2e.mjs
      - run: npm run test:e2e
      - name: Dispose synthetic database
        if: always()
        run: npx --yes supabase@2.121.0 stop --no-backup
